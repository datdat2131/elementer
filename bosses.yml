# Boss nguyên tố + nguyên liệu (Tinh Thể) + đổi Vé Nguyên Tố.
# Boss dùng kỹ năng nguyên tố để tấn công người chơi; chết thì rơi Tinh Thể của nguyên tố đó cho người chơi gây đủ sát thương.
# Đổi đủ Tinh Thể (mục exchange) lấy 1 Vé Nguyên Tố của đúng nguyên tố -> chuột phải để sở hữu (tối đa 3 nguyên tố/người).
settings:
  tick-interval: 10             # nhịp AI (tick); 20 tick = 1 giây
  cast-interval-seconds: 2.5    # khoảng cách tối thiểu giữa hai lần boss tung kỹ năng
  max-damage: 30.0              # trần sát thương của MỘT đòn boss lên người chơi
  damage-multiplier: 1.0        # nhân chung sát thương kỹ năng boss (chỉnh độ khó)
  max-active: 5                 # số boss tối đa cùng lúc
  bar-range: 48                 # tầm hiện thanh máu boss
  min-damage-share: 0.05        # phải gây >= 5% tổng sát thương lên boss mới nhận thưởng
  announce: true
  spawn-when-player-within: 96  # điểm hồi sinh chỉ spawn khi có người chơi trong bán kính này
  speech-enabled: true          # boss "nói" trong chat (lines của từng boss bên dưới)
  speech-range: 48
  speech-format: "&8[{boss}&8] &f{text}"
  cast-line-chance: 0.3         # xác suất nói khi tung kỹ năng
  cast-line-cooldown-seconds: 8 # khoảng cách tối thiểu giữa hai lời khi tung kỹ năng

# Vật phẩm dùng làm Tinh Thể (nhận diện bằng thẻ ẩn, không lẫn với vật phẩm thường)
crystals:
  FIRE: MAGMA_CREAM
  ICE: PRISMARINE_CRYSTALS
  LIGHTNING: AMETHYST_SHARD
  EARTH: EMERALD
  WIND: PHANTOM_MEMBRANE
  LIGHT: GLOWSTONE_DUST

# Số Tinh Thể cần để đổi 1 Vé Nguyên Tố. Nguyên tố KHÔNG có trong danh sách (Bóng Tối, Rồng) chỉ có bằng vé nạp.
exchange:
  FIRE: 48
  ICE: 48
  LIGHTNING: 48
  EARTH: 48
  WIND: 48
  LIGHT: 48

# Điểm hồi sinh tự động (tùy chọn). Boss chết thì hồi sinh sau respawn-minutes phút khi có người chơi lại gần.
# Ví dụ:
#  - { boss: fire_lord, world: world_nether, x: 100.5, y: 70, z: -200.5, respawn-minutes: 90 }
spawns: []

# Boss: dùng /elementeradmin boss spawn <id> để triệu hồi tại chỗ bạn đứng.
# rewards.voucher-chance: xác suất (0-1) rớt thẳng 1 Vé Nguyên Tố của boss cho mỗi người nhận thưởng (bỏ qua nếu đã sở hữu/đủ 3 nguyên tố).
# rewards.items: vật phẩm rớt thêm (ngoài Tinh Thể): { material, min, max (<=64), chance 0-1, name (tùy chọn) } - roll riêng cho từng người nhận thưởng.
# abilities: type = PROJECTILE | AOE_SELF | AOE_TARGET | HEAL_SELF (power = % máu tối đa hồi, 0-1)
#   Đòn vùng (AOE_*) luôn có báo hiệu: vòng hạt hiện trước, sau delay-ticks mới gây sát thương.
#   effects dùng cùng khóa như skills.yml (burn-seconds, slow-seconds, root-seconds, knockback, lift, pull, blind-seconds...)
